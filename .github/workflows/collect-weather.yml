name: Collect Gangnam Weather Data

on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install requests firebase-admin

      - name: Firebase 서비스 계정 키 파일 생성
        run: echo '${{ secrets.FIREBASE_KEY_JSON }}' > firebase-key.json

      - name: 날씨 수집 스크립트 실행
        env:
          SERVICE_KEY: ${{ secrets.WEATHER_SERVICE_KEY }}
        run: python weather_collecter.py
