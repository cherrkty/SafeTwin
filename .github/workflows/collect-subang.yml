name: Collect Gangnam Subang Data

on:
  schedule:
    # ★ GitHub Actions는 최소 5분 간격 cron만 지원하고, 트래픽이 몰리면 몇 분 지연될 수 있음
    #   (무료 요금제 한계 — 포트폴리오 데모 용도로는 충분함)
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # ★ Actions 탭에서 수동으로도 즉시 실행 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install requests beautifulsoup4 firebase-admin

      - name: Firebase 서비스 계정 키 파일 생성
        run: echo '${{ secrets.FIREBASE_KEY_JSON }}' > firebase-key.json

      - name: 수집 스크립트 실행
        run: python subang_collector.py
